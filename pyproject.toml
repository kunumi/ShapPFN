[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shappfn"
version = "0.1.0"
dependencies = [
    "numpy",
    "torch",
    "schedulefree",
    "tabicl",
    "tabpfn",
    "scikit-learn",
    "pandas",
    "scipy",
    "shap",
    "openml",
    "xgboost"
]

[project.optional-dependencies]
wandb = ["wandb"]
tabpfn = ["tabpfn"]
viz = ["matplotlib"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
